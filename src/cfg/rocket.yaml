rocket:
  metadata:
    name: "Artemis-II"

  global_parametrs:
    total_mass: 2608000 # Примерная полная стартовая масса SLS Block 1 в кг (ок. 5.75 млн фунтов)
    payload_mass: 26500 # Масса полезной нагрузки (корабль Orion CM + ESM)
    stage_worked:       # 1 - SRB, 2 - Core Stage (RS-25), 3 - ICPS
      1: [ 1, 2 ]       # Со старта работают ускорители и центральный блок
      2: [ 2 ]          # После 128 сек ускорители отстреливаются, работает только центр
      3: [ 3 ]          # Орбитальные маневры (PRM, ARB, TLI) выполняет верхняя ступень

  stages:
    - stage_number: 1
      name: "SRB" # Два твердотопливных ускорителя
      dry_mass: 200000 # Сухая масса двух ускорителей (~100 т каждый)
      fuel_mass: 1360000 # Масса топлива двух ускорителей (~680 т каждый)
      engines:
        t_max: 32028000 # Суммарная макс. тяга двух SRB (16014 кН * 2)
        i_sp: 268 # Удельный импульс твердотопливного двигателя на уровне моря
        thottle_prog:
          time: [0, 50, 126, 128] # Старт, прохождение Max-Q, начало падения тяги, отстрел
          throttle: [91, 100, 100, 0] # Тяга при старте ~14,679 кН (это ~91% от максимума)

    - stage_number: 2
      name: "Core_Stage" # Центральная ступень с двигателями RS-25
      dry_mass: 85000 # Сухая масса
      fuel_mass: 979000 # Жидкий кислород + водород
      engines:
        t_max: 9116000 # Суммарная макс. тяга четырех RS-25 при 109% (2279 кН * 4)
        i_sp: 452 # Удельный импульс в вакууме
        thottle_prog:
          time: [   0, 50, 128, 436.8, 436.9, 5250, 5250.1, 50000] # Старт, Max-Q, отстрел SRB, MECO (отключение)
          throttle: [81, 109, 109,  109, 0, 0, 100, 100] # При старте 418,000 lbs (1859 кН = ~81% от 2279 кН), затем выход на 109%

    - stage_number: 3
      name: "ICPS" # Верхняя ступень (криогенная)
      dry_mass: 3490 # Сухая масса
      fuel_mass: 27200 # Масса топлива для маневров
      engines:
        t_max: 110100 # Тяга 110.1 кН
        i_sp: 462 # Удельный импульс двигателя RL10B-2
        thottle_prog:
          # Тайминги переведены в секунды от старта (T+0):
          # PRM: 49м 02с = 2942 с
          # ARB: 1ч 48м 48с = 6528 с
          # TLI: 1д 1ч 37м = 92220 с
          # Время работы указано примерно (по 20-100 сек на включение, в коде можно скорректировать под требуемую delta-v)
          time:     [0, 2941,2942, 2970, 2971,  5250, 5250.1, 5721.20, 5721.201, 6551,  90321, 90321.1, 90379, 90379.1]
          throttle: [0,   0,  100,  100,    0,    0,   100,    100,      0,       0,      0,     100, 100, 0]